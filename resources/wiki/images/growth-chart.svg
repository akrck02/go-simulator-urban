<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .land { fill: #f6f8fa; }
    .frame { fill: none; stroke: #d0d7de; stroke-width: 1; }
    .title { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .text { fill: #59636e; font-size: 12.5px; }
    .label { fill: #59636e; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .faint { stroke: #d0d7de; stroke-width: 1; fill: none; stroke-dasharray: 3 4; }
    .water { fill: #b6dcf7; } .river { stroke: #b6dcf7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .obstacle { fill: #e6e9e2; }
    .plot { fill: #ece6d3; } .extensive { fill: #c4d4a4; }
    .housing { fill: #b86f52; } .shop { fill: #d4a72c; } .workshop { fill: #6e7781; }
    .f1 { fill: #f2cdbd; } .f2 { fill: #dc9b80; } .f3 { fill: #b86f52; } .f4 { fill: #8a4a33; } .f5 { fill: #5a2817; }
    .road { stroke: #bf8700; } .street { stroke: #8c959f; } .alley { stroke: #b6bec7; } .main { stroke: #cf222e; }
    .quay { stroke: #218bff; } .ring { stroke: #8250df; }
    .wall { stroke: #1f2328; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .oldwall { stroke: #8c959f; fill: none; stroke-dasharray: 4 3; }
    .bridge { stroke: #1f2328; fill: none; stroke-linecap: butt; }
    .square { fill: #fff3b0; stroke: #d4a72c; stroke-width: 0.8; }
    .window { fill: none; stroke: #8c959f; stroke-width: 1; stroke-dasharray: 4 3; }
    .people { stroke: #bc4c00; fill: none; stroke-width: 2.2; } .peopledot { fill: #bc4c00; }
    .ground { stroke: #0969da; fill: none; stroke-width: 2.2; } .grounddot { fill: #0969da; }
    .expected { stroke: #0969da; fill: none; stroke-width: 1.4; stroke-dasharray: 5 4; opacity: 0.6; }
    .marker { stroke: #1f2328; stroke-width: 1; stroke-dasharray: 2 3; }
    .ink { fill: #1f2328; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .land { fill: #161b22; }
      .frame { stroke: #30363d; }
