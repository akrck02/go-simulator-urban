# Publishes docs/ as a website on GitHub Pages with papiro (https://github.com/akrck02/papiro-deploy).
name: Publish documents
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: akrck02/papiro-deploy@main
        with:
          title: "Go Urban Simulator"
          description: "The urban plugin of go-simulator: towns that grow"
          logo: "./docs/images/logo.svg"
          accent: "#F2A541"
          path: "./docs"
          isObsidianProject: false
          showFooter: true
          showBreadcrumb: true
          showStartPage: true
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.3.0
        with:
          branch: gh-pages
          folder: .
