<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .accent { fill: #ddf4ff; stroke: #54aeff; }
    .title { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .text { fill: #59636e; font-size: 12.5px; }
    .code { fill: #0969da; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .label { fill: #59636e; font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .arrow { stroke: #8c959f; stroke-width: 1.6; fill: none; }
    .head { fill: #8c959f; }
    .dashed { fill: #ffffff; stroke: #d0d7de; stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; }
      .accent { fill: #0c2d4b; stroke: #1f6feb; }
      .title { fill: #e6edf3; }
      .text { fill: #9198a1; }
      .code { fill: #4493f8; }
      .label { fill: #9198a1; }
      .arrow { stroke: #6e7681; }
      .head { fill: #6e7681; }
      .dashed { fill: #0d1117; stroke: #30363d; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="880" height="380" rx="12"/>
  <rect class="accent" x="24" y="24" width="196" height="92" rx="10" stroke-width="1.2"/>
  <text class="title" x="38" y="48">1. Demand</text>
  <text class="label" x="38" y="66">city</text>
  <text class="text" x="38" y="86">people this year ×</text>
  <text class="text" x="38" y="103">m² each − what is built</text>
  <path class="arrow" d="M222,70 H238" marker-end="url(#arrow)"/>
  <rect class="box" x="240" y="24" width="196" height="92" rx="10" stroke-width="1.2"/>
  <text class="title" x="254" y="48">2. Densify</text>
  <text class="label" x="254" y="66">densify</text>
  <text class="text" x="254" y="86">plots fill: back,</text>
  <text class="text" x="254" y="103">then up a floor</text>
  <path class="arrow" d="M438,70 H454" marker-end="url(#arrow)"/>
  <rect class="box" x="456" y="24" width="196" height="92" rx="10" stroke-width="1.2"/>
  <text class="title" x="470" y="48">3. Expand</text>
  <text class="label" x="470" y="66">expand</text>
  <text class="text" x="470" y="86">new plots on free</text>
  <text class="text" x="470" y="103">frontages, new streets</text>
  <path class="arrow" d="M654,70 H670" marker-end="url(#arrow)"/>
  <rect class="box" x="672" y="24" width="196" height="92" rx="10" stroke-width="1.2"/>
  <text class="title" x="686" y="48">4. Walls</text>
  <text class="label" x="686" y="66">walls</text>
  <text class="text" x="686" y="86">the first wall, or a</text>
  <text class="text" x="686" y="103">new one, when due</text>
  <rect class="dashed" x="24" y="136" width="196" height="92" rx="10" stroke-width="1.2"/>
  <text class="title" x="38" y="160">5. Prune</text>
  <text class="label" x="38" y="178">prune_empty_streets</text>
  <text class="text" x="38" y="198">dead ends nobody</text>
  <text class="text" x="38" y="215">built on go away</text>
  <path class="arrow" d="M222,182 H238" marker-end="url(#arrow)"/>
  <rect class="dashed" x="240" y="136" width="196" height="92" rx="10" stroke-width="1.2"/>
  <text class="title" x="254" y="160">6. Split</text>
  <text class="label" x="254" y="178">split_large_blocks</text>
  <text class="text" x="254" y="198">an alley across</text>
  <text class="text" x="254" y="215">blocks too wide</text>
  <path class="arrow" d="M438,182 H454" marker-end="url(#arrow)"/>
  <rect class="dashed" x="456" y="136" width="196" height="92" rx="10" stroke-width="1.2"/>
  <text class="title" x="470" y="160">7. Space syntax</text>
  <text class="label" x="470" y="178">space_syntax</text>
  <text class="text" x="470" y="198">main streets, the</text>
  <text class="text" x="470" y="215">market, shops</text>
  <path class="arrow" d="M654,182 H670" marker-end="url(#arrow)"/>
  <rect class="dashed" x="672" y="136" width="196" height="92" rx="10" stroke-width="1.2"/>
  <text class="title" x="686" y="160">8. Squares</text>
  <text class="label" x="686" y="178">squares</text>
  <text class="text" x="686" y="198">at busy crossings,</text>
  <text class="text" x="686" y="215">gates, bridgeheads</text>
  <rect class="box" x="672" y="248" width="196" height="92" rx="10" stroke-width="1.2"/>
  <text class="title" x="686" y="272">9. Indicators</text>
  <text class="label" x="686" y="290">indicators</text>
  <text class="text" x="686" y="310">the town's measures,</text>
  <text class="text" x="686" y="327">in the listed years</text>
  <path class="arrow" d="M770.0,118 V126 H122.0 V134" marker-end="url(#arrow)"/>
  <path class="arrow" d="M770.0,230 V246" marker-end="url(#arrow)"/>
  <rect class="box" x="24" y="248" width="628" height="92" rx="10" stroke-width="1.2"/>
  <text class="title" x="38" y="272">After every request: publish</text>
  <text class="text" x="38" y="296">Only the entities that changed since the last time travel to the host: new plots, taller houses,</text>
  <text class="text" x="38" y="313">streets that changed class, a new wall. The host applies them; the viewer redraws.</text>
  <path class="arrow" d="M670,294 H656" marker-end="url(#arrow)"/>
  <rect class="dashed" x="24" y="354" width="22" height="12" rx="3" stroke-width="1.2"/>
  <text class="text" x="54" y="365">every few years (every: N in the rules file); the rest run every year, in the rules file's order</text>
</svg>
